name: Release Windows

# Uma tag v1.2.3 gera o instalador e publica a release com ele.
# "Run workflow" (manual) só gera o instalador, como artefato da execução.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalar dependências
        run: npm ci

      - name: A tag bate com a versão do package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão $version do package.json (use npm run version:set)"
            exit 1
          fi

      - name: Testes da interface
        run: npm test

      - name: Testes do Rust
        working-directory: src-tauri
        run: cargo test --locked

      - name: Gerar instalador e publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: PartiTAB ${{ github.ref_name }}
          releaseBody: |
            Instalador para Windows 10/11: baixe o arquivo `PartiTAB_..._x64-setup.exe` (ou o `.msi`).
            Quem já tem o PartiTAB pode atualizar em Ajustes → Atualizações.
          releaseDraft: false
          prerelease: false

      - name: Gerar instalador (sem publicar)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0

      - name: Guardar o instalador na execução
        uses: actions/upload-artifact@v4
        with:
          name: PartiTAB-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
