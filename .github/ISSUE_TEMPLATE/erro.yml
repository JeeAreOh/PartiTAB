name: Relatar um erro
description: Algo não funcionou como deveria
labels: [erro]
body:
  - type: markdown
    attributes:
      value: Obrigado por relatar! Quanto mais detalhes, mais rápido dá para corrigir.
  - type: textarea
    id: oque
    attributes:
      label: O que aconteceu
      description: Descreva o erro e, se puder, anexe um print da tela.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abri a música ...
        2. Escolhi o modo ...
        3. Ao tocar ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava
  - type: input
    id: versao
    attributes:
      label: Versão do PartiTAB
      description: Em Ajustes → Atualizações → Versão instalada
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows
      placeholder: "Windows 11"
  - type: input
    id: teclado
    attributes:
      label: Teclado ou piano digital
      placeholder: "Yamaha PSR-E463, ligado por USB"
